<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="256" height="256" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Local device (monitor) -->
  <g transform="translate(40, 92)">
    <rect x="0" y="0" width="70" height="52" rx="8" ry="8" fill="#0f1923" stroke="#4fc3f7" stroke-width="4"/>
    <rect x="10" y="10" width="50" height="32" rx="2" fill="#123047"/>
    <rect x="24" y="56" width="22" height="8" rx="2" fill="#4fc3f7"/>
  </g>

  <!-- Remote server rack -->
  <g transform="translate(150, 84)">
    <rect x="0" y="0" width="66" height="70" rx="8" ry="8" fill="#0f1923" stroke="#ffd54f" stroke-width="4"/>
    <rect x="10" y="12" width="46" height="10" rx="2" fill="#1a2a3a"/>
    <rect x="10" y="30" width="46" height="10" rx="2" fill="#1a2a3a"/>
    <rect x="10" y="48" width="46" height="10" rx="2" fill="#1a2a3a"/>
    <circle cx="48" cy="17" r="3" fill="#28c840"/>
    <circle cx="48" cy="35" r="3" fill="#28c840"/>
    <circle cx="48" cy="53" r="3" fill="#ff5f57"/>
  </g>

  <!-- Bidirectional connection between local device and remote server -->
  <g stroke="#81d4fa" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M114 118 L146 118" stroke-dasharray="6 8"/>
    <path d="M120 110 L110 118 L120 126" fill="none"/>
    <path d="M140 110 L150 118 L140 126" fill="none"/>
  </g>

  <!-- Data packet in transit -->
  <circle cx="128" cy="118" r="7" fill="#ffffff"/>
</svg>
